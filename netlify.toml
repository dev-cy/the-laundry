# Canonical host: custom subdomain. Netlify permalinks and www go there.
[[redirects]]
  from = "https://the-laundry.netlify.app/*"
  to = "https://the-laundry.cyregjr.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://the-laundry.netlify.app/*"
  to = "https://the-laundry.cyregjr.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.the-laundry.cyregjr.com/*"
  to = "https://the-laundry.cyregjr.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.the-laundry.cyregjr.com/*"
  to = "https://the-laundry.cyregjr.com/:splat"
  status = 301
  force = true
